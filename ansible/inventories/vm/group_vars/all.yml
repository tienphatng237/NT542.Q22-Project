# Global pipeline paths
pipeline_local_root: "{{ inventory_dir }}/../../../pipeline"
pipeline_local_reports_root: "{{ pipeline_local_root }}/reports"

pipeline_remote_root: 'C:\\CIS-Automation'
pipeline_remote_script_root: '{{ pipeline_remote_root }}\\Scripts'
pipeline_remote_reports_json: '{{ pipeline_remote_root }}\\Reports\\JSON'
pipeline_remote_reports_html: '{{ pipeline_remote_root }}\\Reports\\HTML'

# Central role/script mapping
pipeline_role_matrix:
  identity_access_control:
    slug: identity-access-control
    phase_script_dir: Identity-Access-Control
    audit_script_name: Identity-Access-Control-Audit.ps1
    remediation_script_name: Identity-Access-Control-Remediation.ps1
    post_audit_script_name: Identity-Access-Control-Post-Audit.ps1

  network_services_security:
    slug: network-services-security
    phase_script_dir: Network-Services-Security
    audit_script_name: CIS-WinServer2022-Audit.ps1
    remediation_script_name: CIS-WinServer2022-Remediation.ps1
    post_audit_script_name: Network-Services-Security-Post-Audit.ps1

  auditing_monitoring:
    slug: auditing-monitoring
    phase_script_dir: Auditing-Monitoring
    audit_script_name: Auditing-Monitoring-Audit.ps1
    remediation_script_name: Auditing-Monitoring-Remediation.ps1
    post_audit_script_name: Auditing-Monitoring-Post-Audit.ps1

  system_hardening_antimalware:
    slug: system-hardening-antimalware
    phase_script_dir: System-Hardening-Antimalware
    audit_script_name: System-Hardening-Antimalware-Audit.ps1
    remediation_script_name: System-Hardening-Antimalware-Remediation.ps1
    post_audit_script_name: System-Hardening-Antimalware-Post-Audit.ps1

# External validation: HardeningKitty
hardeningkitty_enabled: true
hardeningkitty_local_root: "{{ inventory_dir }}/../../../tooling/hardeningkitty"
hardeningkitty_local_module_dir: "{{ hardeningkitty_local_root }}/module"
hardeningkitty_local_lists_dir: "{{ hardeningkitty_local_root }}/lists"

hardeningkitty_remote_root: "{{ pipeline_remote_root }}\\Validation\\HardeningKitty"
hardeningkitty_remote_module_dir: "{{ hardeningkitty_remote_root }}\\module"
hardeningkitty_remote_lists_dir: "{{ hardeningkitty_remote_root }}\\lists"
hardeningkitty_remote_output_dir: "{{ pipeline_remote_root }}\\Validation\\Reports\\HardeningKitty"

# Default profile-to-list mapping for Windows Server 2022 role-based validation.
# Use per-host overrides only when a node needs a different list than its role.
hardeningkitty_finding_list_by_profile:
  dc: finding_list_msft_security_baseline_windows_server_2022_21h2_dc_machine.csv
  member: finding_list_msft_security_baseline_windows_server_2022_21h2_member_machine.csv

hardeningkitty_finding_list_by_host: {}

# Wazuh centralized monitoring
# Agents enroll against the first Linux host in the log_servers inventory group.
wazuh_manager_address: "{{ hostvars[groups['log_servers'][0]].ansible_host if (groups['log_servers'] | default([]) | length > 0) else '' }}"
wazuh_agent_group: windows-servers
wazuh_agent_sca_interval: 2m
