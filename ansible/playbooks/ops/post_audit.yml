---
- name: Phase 3 - Post-Audit
  hosts: windows
  gather_facts: false
  vars:
    windows_runtime_ops_account_name: "{{ windows_identity_admin_target_name | default(windows_active_admin_account_name | default('Administrator')) }}"
    windows_active_admin_account_name: "{{ windows_runtime_ops_account_name }}"
    ansible_user: ".\\{{ windows_runtime_ops_account_name }}"
    ansible_password: "{{ windows_identity_admin_password | default(windows_initial_admin_password | default('')) }}"
  tasks:
    - ansible.builtin.include_role:
        name: identity_access_control
        tasks_from: post_audit.yml
    - ansible.builtin.include_role:
        name: network_services_security
        tasks_from: post_audit.yml
    - ansible.builtin.include_role:
        name: auditing_monitoring
        tasks_from: post_audit.yml
    - ansible.builtin.include_role:
        name: system_hardening_antimalware
        tasks_from: post_audit.yml
