---
- name: Phase 3 - Post-Audit
  hosts: windows
  gather_facts: false
  vars:
    windows_active_admin_account_name: "{{ windows_identity_admin_target_name }}"
    ansible_user: ".\\{{ windows_identity_admin_target_name }}"
  tasks:
    - ansible.builtin.include_role:
        name: identity_access_control
        tasks_from: post_audit.yml
    - ansible.builtin.include_role:
        name: network_services_security
        tasks_from: post_audit.yml
    - ansible.builtin.include_role:
        name: auditing_monitoring
        tasks_from: post_audit.yml
    - ansible.builtin.include_role:
        name: system_hardening_antimalware
        tasks_from: post_audit.yml
