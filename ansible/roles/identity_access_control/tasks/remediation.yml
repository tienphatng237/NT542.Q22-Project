---
- name: Set remediation script source path
  ansible.builtin.set_fact:
    role_script_src: "{{ pipeline_local_root }}/remediation/{{ role_phase_script_dir }}/{{ role_remediation_script_name }}"
    role_script_name: "{{ role_remediation_script_name }}"

- name: Check local remediation script exists
  ansible.builtin.stat:
    path: "{{ role_script_src }}"
  delegate_to: localhost
  register: role_script_stat

- name: Skip role remediation when script is missing
  ansible.builtin.debug:
    msg: "Skip {{ role_slug }} remediation: missing {{ role_script_src }}"
  when: not role_script_stat.stat.exists

- name: Ensure remote role script directory exists
  ansible.windows.win_file:
    path: "{{ role_remote_script_dir }}"
    state: directory
  when: role_script_stat.stat.exists

- name: Copy remediation script to Windows host
  ansible.windows.win_copy:
    src: "{{ role_script_src }}"
    dest: "{{ role_remote_script_dir }}\\{{ role_script_name }}"
  when: role_script_stat.stat.exists

- name: Execute remediation script
  ansible.windows.win_shell: >-
    powershell -ExecutionPolicy Bypass
    -File "{{ role_remote_script_dir }}\\{{ role_script_name }}"
    -AdminAccountNewName "{{ windows_identity_admin_target_name }}"
    -GuestAccountNewName "{{ windows_identity_guest_target_name }}"
    -AdminAccountPassword "{{ windows_identity_admin_password }}"
  register: role_remediation_exec
  when: role_script_stat.stat.exists

- name: Switch Ansible to hardened Windows admin account after remediation
  ansible.builtin.set_fact:
    windows_active_admin_account_name: "{{ windows_identity_admin_target_name }}"
    ansible_user: "{{ windows_identity_admin_target_name }}"
    ansible_password: "{{ windows_identity_admin_password }}"
  when: role_script_stat.stat.exists

- name: Reset WinRM connection after admin account rename
  meta: reset_connection
  when: role_script_stat.stat.exists

- name: Show remediation output
  ansible.builtin.debug:
    var: role_remediation_exec.stdout_lines
  when: role_script_stat.stat.exists
