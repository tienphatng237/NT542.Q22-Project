policy:
  id: "nt542_identity_access_control"
  file: "identity_access_control.yml"
  name: "NT542 - Identity & Access Control (Windows Server 2022)"
  description: "SCA checks generated from NT542 pipeline Identity & Access Control audit rules."
  references:
    - "https://www.cisecurity.org/benchmark/microsoft_windows_server"
    - "https://documentation.wazuh.com/current/user-manual/capabilities/sec-config-assessment/creating-custom-policies.html"

checks:
  - id: 850001
    title: '1.1.1 Ensure ''Enforce password history'' is set to ''24 or more password(s)'''
    description: 'Ensure ''Enforce password history'' is set to ''24 or more password(s)'''
    compliance:
      - cis: ['1.1.1']
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$cfg=$env:TEMP+''\\wz_id_secpol.cfg''; secedit /export /cfg $cfg /quiet | Out-Null; $m=(Get-Content $cfg | Select-String "^PasswordHistorySize\s*=\s*(\d+)" | Select-Object -First 1).Matches; if ($m.Count -gt 0) { $m[0].Groups[1].Value }" -> n:^(\d+)$ compare >= 24'

  - id: 850002
    title: '1.1.2 Ensure ''Maximum password age'' is set to ''365 or fewer days'''
    description: 'Ensure ''Maximum password age'' is set to ''365 or fewer days'''
    compliance:
      - cis: ['1.1.2']
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$cfg=$env:TEMP+''\\wz_id_secpol.cfg''; secedit /export /cfg $cfg /quiet | Out-Null; $m=(Get-Content $cfg | Select-String "^MaximumPasswordAge\s*=\s*(\d+)" | Select-Object -First 1).Matches; if ($m.Count -gt 0) { $m[0].Groups[1].Value }" -> n:^(\d+)$ compare <= 365'

  - id: 850003
    title: '1.1.3 Ensure ''Minimum password age'' is set to ''1 or more day(s)'''
    description: 'Ensure ''Minimum password age'' is set to ''1 or more day(s)'''
    compliance:
      - cis: ['1.1.3']
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$cfg=$env:TEMP+''\\wz_id_secpol.cfg''; secedit /export /cfg $cfg /quiet | Out-Null; $m=(Get-Content $cfg | Select-String "^MinimumPasswordAge\s*=\s*(\d+)" | Select-Object -First 1).Matches; if ($m.Count -gt 0) { $m[0].Groups[1].Value }" -> n:^(\d+)$ compare >= 1'

  - id: 850004
    title: '1.1.4 Ensure ''Minimum password length'' is set to ''14 or more'''
    description: 'Ensure ''Minimum password length'' is set to ''14 or more'''
    compliance:
      - cis: ['1.1.4']
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$cfg=$env:TEMP+''\\wz_id_secpol.cfg''; secedit /export /cfg $cfg /quiet | Out-Null; $m=(Get-Content $cfg | Select-String "^MinimumPasswordLength\s*=\s*(\d+)" | Select-Object -First 1).Matches; if ($m.Count -gt 0) { $m[0].Groups[1].Value }" -> n:^(\d+)$ compare >= 14'

  - id: 850005
    title: '1.1.5 Ensure ''Password must meet complexity requirements'' is set to ''Enabled'''
    description: 'Ensure ''Password must meet complexity requirements'' is set to ''Enabled'''
    compliance:
      - cis: ['1.1.5']
    condition: all
    rules:
      - 'c:powershell -NoProfile -Command "$cfg=$env:TEMP+''\\wz_id_secpol.cfg''; secedit /export /cfg $cfg /quiet | Out-Null; $m=(Get-Content $cfg | Select-String "^PasswordComplexity\s*=\s*(\d+)" | Select-Object -First 1).Matches; if ($m.Count -gt 0) { $m[0].Groups[1].Value }" -> n:^(\d+)$ compare == 1'

  - id: 850006
    title: '1.1.6 Ensure ''Relax minimum password length limits'' is set to ''Enabled'''
    description: 'Ensure ''Relax minimum password length limits'' is set to ''Enabled'''
    compliance:
      - cis: ['1.1.6']
    condition: all
    rules:
      - 'r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SAM'
      - 'r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SAM -> RelaxMinimumPasswordLengthLimits'
      - 'r:HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SAM -> RelaxMinimumPasswordLengthLimits -> 1'

  - id: 850007
    title: '1.1.7 Ensure ''Store passwords using reversible encryption'' is set to ''Disabled'''
    description: 'Ensure ''Store passwords using reversible encryption'' is set to ''Disabled'''
    compliance:
      - cis: ['1.1.7']
    condition: all
    rules:
