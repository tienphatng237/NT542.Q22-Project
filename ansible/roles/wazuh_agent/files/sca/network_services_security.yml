policy:
  id: "nt542_network_services_security"
  file: "network_services_security.yml"
  name: "NT542 - Network Services Security (Windows Server 2022)"
  description: "SCA checks generated from NT542 pipeline Network Services Security audit rules."
  references:
    - "https://www.cisecurity.org/benchmark/microsoft_windows_server"
    - "https://documentation.wazuh.com/current/user-manual/capabilities/sec-config-assessment/creating-custom-policies.html"

checks:
  - id: 850054
    title: '2.3.8.1 Ensure ''Microsoft network client: Digitally sign communications (always)'' is set to ''Enabled'''
    description: 'Ensure ''Microsoft network client: Digitally sign communications (always)'' is set to ''Enabled'''
    compliance:
      - cis: ['2.3.8.1']
    condition: all
    rules:
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters -> RequireSecuritySignature'
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters -> RequireSecuritySignature -> n:^(\d+)$ compare == 1'

  - id: 850055
    title: '2.3.8.2 Ensure ''Microsoft network client: Send unencrypted password to third-party SMB servers'' is set to ''Disabled'''
    description: 'Ensure ''Microsoft network client: Send unencrypted password to third-party SMB servers'' is set to ''Disabled'''
    compliance:
      - cis: ['2.3.8.2']
    condition: all
    rules:
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters'
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters -> EnablePlainTextPassword'
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters -> EnablePlainTextPassword -> n:^(\d+)$ compare == 0'

  - id: 850056
    title: '2.3.9.1 Ensure ''Microsoft network server: Amount of idle time required before suspending session'' is set to ''15 or fewer minute(s)'''
    description: 'Ensure ''Microsoft network server: Amount of idle time required before suspending session'' is set to ''15 or fewer minute(s)'''
    compliance:
      - cis: ['2.3.9.1']
    condition: all
    rules:
