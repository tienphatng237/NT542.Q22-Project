      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters -> autodisconnect'
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters -> autodisconnect -> n:^(\d+)$ compare <= 15'
      - 'r:HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters -> autodisconnect -> n:^(\d+)$ compare > 0'

  - id: 850057
    title: '2.3.9.2 Ensure ''Microsoft network server: Digitally sign communications (always)'' is set to ''Enabled'''
    description: 'Ensure ''Microsoft network server: Digitally sign communications (always)'' is set to ''Enabled'''
