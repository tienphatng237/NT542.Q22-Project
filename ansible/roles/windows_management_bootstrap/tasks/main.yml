---
- name: Ensure Windows management bootstrap directory exists
  ansible.windows.win_file:
    path: "{{ windows_management_remote_root }}"
    state: directory

- name: Install Windows management self-healing script
  ansible.windows.win_copy:
    dest: "{{ windows_management_remote_root }}\\{{ windows_management_script_name }}"
    content: |
      param(
          [string]$ManagementSubnet = '{{ windows_management_subnet }}',
          [bool]$EnableOpenSSH = {{ '$true' if windows_enable_openssh_fallback else '$false' }},
          [bool]$EnableLocalAccountWinRMUacBypass = {{ '$true' if windows_enable_local_account_winrm_uac_bypass else '$false' }}
      )

      $ErrorActionPreference = 'Stop'

      function Ensure-WinRM {
          winrm quickconfig -q | Out-Null
          Enable-PSRemoting -Force | Out-Null
          Set-Service -Name WinRM -StartupType Automatic
          Start-Service -Name WinRM
          Enable-NetFirewallRule -DisplayGroup 'Windows Remote Management' | Out-Null
          Set-NetFirewallRule -DisplayGroup 'Windows Remote Management' -RemoteAddress $ManagementSubnet | Out-Null
          if ($EnableLocalAccountWinRMUacBypass) {
              try {
                  if (-not (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System')) {
                      New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Force | Out-Null
                  }
                  Set-ItemProperty `
                      -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
                      -Name 'LocalAccountTokenFilterPolicy' `
                      -Type DWord `
                      -Value 1 `
                      -Force
              }
              catch {
                  Write-Warning "Skip LocalAccountTokenFilterPolicy tuning: $($_.Exception.Message)"
              }
          }
      }

      function Ensure-OpenSSH {
          $capability = Get-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          if ($capability.State -ne 'Installed') {
              Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }

          Set-Service -Name sshd -StartupType Automatic
          Start-Service -Name sshd

          if (-not (Get-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule `
                  -Name 'OpenSSH-Server-In-TCP' `
                  -DisplayName 'OpenSSH Server (TCP-In)' `
                  -Enabled True `
                  -Direction Inbound `
                  -Protocol TCP `
                  -Action Allow `
                  -LocalPort 22 `
                  -RemoteAddress $ManagementSubnet | Out-Null
          }
          else {
              Set-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -Enabled True -RemoteAddress $ManagementSubnet | Out-Null
          }
      }

      Ensure-WinRM
      if ($EnableOpenSSH) {
          Ensure-OpenSSH
      }

- name: Run Windows management self-healing script now
  ansible.windows.win_shell: >-
    powershell -ExecutionPolicy Bypass
    -File "{{ windows_management_remote_root }}\\{{ windows_management_script_name }}"
  register: windows_management_bootstrap_exec

- name: Register startup self-healing scheduled task
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $taskName = '{{ windows_management_scheduled_task_name }}'
    $taskCommand = 'powershell.exe'
    $taskArguments = '-NoProfile -ExecutionPolicy Bypass -File "{{ windows_management_remote_root }}\\{{ windows_management_script_name }}"'

    schtasks.exe /Create /TN $taskName /SC ONSTART /RU SYSTEM /RL HIGHEST /TR "`"$taskCommand`" $taskArguments" /F | Out-Null
    schtasks.exe /Change /TN $taskName /ENABLE | Out-Null
  when: windows_enable_startup_self_heal | bool

- name: Show Windows management bootstrap output
  ansible.builtin.debug:
    var: windows_management_bootstrap_exec.stdout_lines
